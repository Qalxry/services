name: 构建测试版 (Build)

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译 Windows 应用
    runs-on: windows-latest

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v7

    - name: 配置 MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: 还原依赖 (Restore)
      run: msbuild Services.sln /t:Restore /p:Configuration=Release

    - name: 运行测试 (Test)
      run: dotnet test Services.Tests/Services.Tests.csproj -c Release

    - name: 编译并发布单文件版 (Build & Publish Single File)
      run: |
        msbuild ServicesApp/ServicesApp.csproj `
          /t:Publish `
          /p:Configuration=Release `
          /p:RuntimeIdentifier=win-x64 `
          /p:PublishSingleFile=true `
          /p:SelfContained=true `
          /p:PublishDir=${{ github.workspace }}\publish-single\ `
          /p:DebugType=none

    - name: 编译服务包装器 (Build Wrapper)
      run: |
        msbuild Services.Wrapper/Services.Wrapper.csproj `
          /t:Publish `
          /p:Configuration=Release `
          /p:PublishDir=${{ github.workspace }}\publish-single\

    - name: 编译命令行工具 (Build CLI)
      run: |
        msbuild Services.Cli/Services.Cli.csproj `
          /t:Publish `
          /p:Configuration=Release `
          /p:PublishDir=${{ github.workspace }}\publish-single\

    - name: 编译集成测试目标程序 (Build Test Target)
      run: dotnet publish Services.TestTarget/Services.TestTarget.csproj -c Release -o ${{ github.workspace }}\it-target

    # 构建机具备管理员权限，集成测试会真实创建、启动、停止并删除服务
    - name: 集成测试 (Integration Tests)
      env:
        SERVICES_IT_BIN: ${{ github.workspace }}\publish-single
        SERVICES_IT_TARGET: ${{ github.workspace }}\it-target
        SERVICES_IT_REQUIRED: '1'
      run: dotnet test Services.IntegrationTests/Services.IntegrationTests.csproj -c Release --logger "console;verbosity=normal"

    - name: 上传集成测试日志 (Upload Integration Logs)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: integration-logs-${{ github.sha }}
        path: C:\ProgramData\windows_service_logs
        retention-days: 7

    - name: 编译安装包 (Build MSI)
      run: msbuild Services.Installer/Services.Installer.wixproj /t:Build /p:Configuration=Release /p:Platform=x64

    - name: 上传构建产物 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ServicesApp-win-x64-${{ github.sha }}
        path: publish-single/
        retention-days: 14

    - name: 上传安装包 (Upload MSI)
      uses: actions/upload-artifact@v4
      with:
        name: ServicesApp-msi-${{ github.sha }}
        path: Services.Installer/bin/x64/Release/ServicesApp.msi
        retention-days: 14
